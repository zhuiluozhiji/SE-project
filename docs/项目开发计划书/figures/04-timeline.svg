<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#f1f7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2a4664" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 28px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #1d334b; }
      .subtitle { font: 400 15px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #5d7084; }
      .phase { font: 700 18px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: white; }
      .body { font: 400 13px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: rgba(255,255,255,.92); }
      .label { font: 700 16px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #18324b; }
    </style>
  </defs>
  <rect width="1200" height="560" fill="url(#bg)"/>
  <text x="56" y="56" class="title">第一阶段开发进度示意图</text>
  <text x="56" y="86" class="subtitle">用于说明计划书中的排期思路，实际日期可根据组内节奏微调</text>

  <line x1="106" y1="255" x2="1096" y2="255" stroke="#7c92a8" stroke-width="5" stroke-linecap="round"/>

  <circle cx="136" cy="255" r="16" fill="#17324d"/>
  <circle cx="420" cy="255" r="16" fill="#377dff"/>
  <circle cx="704" cy="255" r="16" fill="#2ab67d"/>
  <circle cx="988" cy="255" r="16" fill="#7c5cff"/>

  <rect x="80" y="110" rx="18" ry="18" width="220" height="108" fill="#17324d" filter="url(#shadow)"/>
  <text x="190" y="146" text-anchor="middle" class="phase">第 1 阶段</text>
  <text x="190" y="172" text-anchor="middle" class="body">数据与基础接口优先</text>
  <text x="190" y="194" text-anchor="middle" class="body">表结构 / 登录 / 活动列表</text>

  <rect x="300" y="310" rx="18" ry="18" width="240" height="108" fill="#377dff" filter="url(#shadow)"/>
  <text x="420" y="346" text-anchor="middle" class="phase">第 2 阶段</text>
  <text x="420" y="372" text-anchor="middle" class="body">核心业务功能开发</text>
  <text x="420" y="394" text-anchor="middle" class="body">推荐 / 课表 / 冲突 / 日程</text>

  <rect x="590" y="110" rx="18" ry="18" width="228" height="108" fill="#2ab67d" filter="url(#shadow)"/>
  <text x="704" y="146" text-anchor="middle" class="phase">第 3 阶段</text>
  <text x="704" y="172" text-anchor="middle" class="body">联调与功能完善</text>
  <text x="704" y="194" text-anchor="middle" class="body">ICS / 后台 / 异常处理</text>

  <rect x="876" y="310" rx="18" ry="18" width="248" height="108" fill="#7c5cff" filter="url(#shadow)"/>
  <text x="1000" y="346" text-anchor="middle" class="phase">第 4 阶段</text>
  <text x="1000" y="372" text-anchor="middle" class="body">测试、修复与交付准备</text>
  <text x="1000" y="394" text-anchor="middle" class="body">报告 / 手册 / 答辩材料</text>

  <text x="112" y="302" class="label">1-2 天</text>
  <text x="398" y="235" class="label">3-5 天</text>
  <text x="676" y="302" class="label">2-3 天</text>
  <text x="960" y="235" class="label">1-2 天</text>

  <text x="56" y="506" style="font:400 15px 'Microsoft YaHei','PingFang SC',sans-serif; fill:#5d7084;">里程碑式推进的意义在于：每一阶段结束时都能形成可检查的成果，避免临近交付时才集中返工。</text>
</svg>
