<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#eef7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2f4662" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 28px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #20354d; }
      .subtitle { font: 400 15px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #5c6f83; }
      .box-title { font: 700 18px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #18324b; }
      .box-text { font: 400 14px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #46586b; }
      .note { font: 400 13px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #64778a; }
      .line-label { font: 600 13px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #516478; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#5d7288"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <text x="56" y="58" class="title">任务分解与依赖关系示意图</text>
  <text x="56" y="88" class="subtitle">以“接口初步确定”为中枢，前端、爬虫、后端并行推进，测试与文档贯穿始终</text>

  <rect x="94" y="156" rx="22" ry="22" width="1012" height="102" fill="#17324d" filter="url(#shadow)"/>
  <text x="600" y="198" text-anchor="middle" style="font:700 24px 'Microsoft YaHei','PingFang SC',sans-serif; fill:white;">接口初步确定</text>
  <text x="600" y="228" text-anchor="middle" style="font:400 15px 'Microsoft YaHei','PingFang SC',sans-serif; fill:#d9e8f6;">明确核心字段、请求响应结构、错误码和联调边界，为并行开发提供统一接口基线</text>

  <rect x="110" y="332" rx="20" ry="20" width="286" height="184" fill="#eef5ff" stroke="#c9d9ee" stroke-width="2" filter="url(#shadow)"/>
  <text x="253" y="372" text-anchor="middle" class="box-title">前端页面实现</text>
  <text x="253" y="402" text-anchor="middle" class="box-text">使用预先设计的 mock 数据</text>
  <text x="253" y="426" text-anchor="middle" class="box-text">先完成页面结构与交互</text>
  <text x="253" y="450" text-anchor="middle" class="box-text">后续再逐步替换为真实接口</text>
  <text x="253" y="485" text-anchor="middle" class="note">特点：依赖接口字段，但不必等待所有后端功能完成</text>

  <rect x="456" y="332" rx="20" ry="20" width="288" height="184" fill="#edf9f2" stroke="#cde8da" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="372" text-anchor="middle" class="box-title">后端核心业务实现</text>
  <text x="600" y="402" text-anchor="middle" class="box-text">登录鉴权、活动查询、推荐规则</text>
  <text x="600" y="426" text-anchor="middle" class="box-text">课表导入、冲突检测、日程管理</text>
  <text x="600" y="450" text-anchor="middle" class="box-text">后台接口与业务闭环</text>
  <text x="600" y="485" text-anchor="middle" class="note">特点：围绕统一接口基线，推进主流程真实实现</text>

  <rect x="804" y="332" rx="20" ry="20" width="286" height="184" fill="#fff7ea" stroke="#efd9ab" stroke-width="2" filter="url(#shadow)"/>
  <text x="947" y="372" text-anchor="middle" class="box-title">爬虫与数据处理</text>
  <text x="947" y="402" text-anchor="middle" class="box-text">低耦合实现抓取与清洗流程</text>
  <text x="947" y="426" text-anchor="middle" class="box-text">优化字段抽取、去重与入库逻辑</text>
  <text x="947" y="450" text-anchor="middle" class="box-text">为联调和演示补充真实样例数据</text>
  <text x="947" y="485" text-anchor="middle" class="note">特点：与前端相对独立，与后端通过数据结构对接</text>

  <rect x="62" y="566" rx="18" ry="18" width="1076" height="82" fill="#f4f8fc" stroke="#d4e0ec" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="600" text-anchor="middle" style="font:700 20px 'Microsoft YaHei','PingFang SC',sans-serif; fill:#20354d;">测试与文档维护贯穿开发始终</text>
  <text x="600" y="628" text-anchor="middle" class="note">持续记录接口变更、维护测试用例、跟踪 Bug、补充文档，贯穿接口确认、并行开发、联调和验收全过程</text>

  <path d="M360 258 C320 292, 288 312, 253 332" fill="none" stroke="#5d7288" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M600 258 L600 332" fill="none" stroke="#5d7288" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M840 258 C880 292, 912 312, 947 332" fill="none" stroke="#5d7288" stroke-width="4" marker-end="url(#arrow)"/>

  <path d="M396 424 C420 424, 430 424, 456 424" fill="none" stroke="#7d92a8" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
  <text x="426" y="410" class="line-label">联调对接</text>

  <path d="M744 424 C768 424, 778 424, 804 424" fill="none" stroke="#7d92a8" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
  <text x="774" y="410" class="line-label">数据接入</text>

  <path d="M253 516 C253 552, 253 556, 253 566" fill="none" stroke="#5d7288" stroke-width="3.5" marker-end="url(#arrow)"/>
  <path d="M600 516 C600 552, 600 556, 600 566" fill="none" stroke="#5d7288" stroke-width="3.5" marker-end="url(#arrow)"/>
  <path d="M947 516 C947 552, 947 556, 947 566" fill="none" stroke="#5d7288" stroke-width="3.5" marker-end="url(#arrow)"/>

  <text x="110" y="678" class="note">图示含义：接口先行提供统一约束，前端可借助 mock 并行推进，爬虫处理逻辑可低耦合独立优化，后端负责真实业务实现；测试与文档不是最后才开始，而是从一开始就持续参与。</text>
</svg>
